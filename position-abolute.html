<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
        }
        .main{
            width:100vw;
            height:100vh;
        }
        .first,
        .second,
        .third,
        .fourth{
            width:80%;
            height:80%;
        }
        .main,
        .second,
        .fourth{
            background-color: gray;

        }
        .first,
        .third{
            background-color: lightgray;
        }
        .box{
            height:100px;
            width:100px;
            color:white;
        }
        #box1{
            background-color:red;
            position:absolute;
            top:0;
            left:0;
        }
        #box2{
            background-color:green;
            position:absolute;
            bottom:0;
            left:0;
        }
        #box3{
            background-color:magenta;
            position: absolute;
        }
        #box4{
            background-color:black;
            position:absolute;
            top:0;
            right:0;
        }
        #box5{
            background-color:blue;
            position:absolute;
            bottom:0;
            right:0;
        }
        .main,
        .first,
        .second,
        .third,
        .fourth,
        .box{
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .main:hover,
        .first:hover,
        .second:hover,
        .third:hover,
        .fourth:hover{
            position:relative;
        }


    </style>
</head>
<body>
    <div class="main">
        <div class="first">
            <div class="second">
                <div class="third">
                    <div class="fourth">
                        <div class="box" id="box1">Box1</div>
                        <div class="box" id="box2">Box2</div>
                        <div class="box" id="box3">Box3</div>
                        <div class="box" id="box4">Box4</div>
                        <div class="box" id="box5">Box5</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
