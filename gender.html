<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <div>
            <label>Gender</label>
            <input type="radio" name="gender" id="male" value="Male" checked>
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female" value="Female">
            <label for="female">Female</label>
            <input type="radio" name="gender" id="other" value="Other">

        </div>
        <div>
            <label>Subject</label>
            <input type="checkbox" name="mern" id="mern" checked>
            <label for="mern">Mern</label>
            <input type="checkbox" name="mean" id="mean" checked>
            <label for="mean">Mean</label>
            <input type="checkbox" name="php"id="php" checked>
            <label for="php">PHP</label>
            <input type="checkbox" name="java" id="java" checked>
            <label for="java">Java</label>
            <input type="checkbox" name="python" id="python" checked>
            <label for="python">Python</label>
        </div>
        <div>
            <label>Range</label>
            <input type="range" name="range" min="-10000" max="10000"
            value="0" step="100" oninput="fun()">
            <span id="rangeSpan">0</span>
        </div>
        <div>
            <label>Color</label>
            <input type="color" name="color">
        </div>
        <div>
            <label>Image</label>
            <input type="image" src="nitinsirhtml/nitin.jpg" height="100px" width="200px"/>
        </div>
        <div>
            <label>Pic</label>
            <input type="file" name="pic" multiple>
        </div>
        <div>
            <button type="reset">Reset</button>
            <button type="submit">Submit</button>
        </div>

    </form>
    <script>
        var range=documnet.querySelector("#range")
        var rangeSpan=documnet.querrySelector("#rangeSpan")
        function fun(){
            rangeSpan.innerHtml=range.value
        }
    </script>

    
</body>
</html>
