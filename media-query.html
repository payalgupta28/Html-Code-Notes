<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin:0;
    }
    .main{
        width:100w;
        height:100vh;
        background-color:lightgray;
        display:grid;
        grid-template-colums: auto auto auto auto auto auto;
        gap:5px;

    }
    .box{
        background-color:navy;
        color:white;
        display:flex;
        justify-content:center;
        align-items:center;

    }
    #box1,
    #box14{
        
            grid-column:1/6 span;
        
    }
    @media only screen and (min-width:1200px) and (max-width:1920px){
        .main{
            height:150vh;
            grid-template-columns:auto auto auto auto;
        }
        .box{
            background-color:black;
        
    }
    #box1,
    #box14{
        grid-column:1/3 span;
    }
}
@media only screen and (min-width:768px) and (max-width:991px){
    .main{
        height:300vh;
        grid-template-columns:auto auto;
    }
    .box{
        background-color:red;
    }
    #box1,
    #box14{
        grid-column:1/4;


    }
}
    

</style>
<body>
   
<div class="main">
    <div class="center">
        <div class="box" id="box1"></div>
        <div class="box" id="box2"></div>
        <div class="box" id="box3"></div>
        <div class="box" id="box4"></div>
        <div class="box" id="box5"></div>
        <div class="box" id="box6"></div>
        <div class="box" id="box7"></div>
        <div class="box" id="box8"></div>
        <div class="box" id="box9"></div>
        <div class="box" id="box10"></div>
        <div class="box" id="box11"></div>
        <div class="box" id="box12"></div>
        <div class="box" id="box13"></div>
        <div class="box" id="box14"></div>
    </div>
</div>
</body>
</html>
