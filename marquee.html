<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <marquee>
        <img src="./nitin.jpg"alt="image"/>
    </marquee>
    <marquee direction="left">
        <img src="./nitin.jpg"alt="image"/>
    </marquee>
    <marquee direction="right" >
        <img src="./nitin.jpg"alt="image"/>
    </marquee>
    <marquee direction="up"alt="image">
        <img src="./nitin.jpg"/>
    </marquee>
    <marquee direction="down">
        <img src="./nitin.jpg"alt="image"/>
    </marquee>
    <marquee behavior="slide" >
        <img src="./nitin.jpg"alt="image"/>
    </marquee>
    <marquee direction="left" scrollamount="50"behavior="slide">
        <img src="./nitin.jpg"alt="image"/>
    </marquee>
    <marquee direction="left"scrollamount="50" behavior="alternate">
        <img src="./nitin.jpg"alt="image"/>
    </marquee>
    
</body>
</html>
