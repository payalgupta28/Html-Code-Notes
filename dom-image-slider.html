<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> 
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
 <style>
        *{
            margin:0;
        }
        .main{

            width:100vw;
            height:100vh;
            display:flex;
            justify-content: center;
            align-items:center;
            
        }
        .center{
            width:80%;
            height:80%;
            position:relative;
        }
        .images{
            width:100%;
            height:100%;
           justify-content: center;
        }
        .images img{
            width:100%;
            height:100%;
            display:none;
        }
        .images img:first-child{
            display:block;
        }
        .btn{
            position:absolute;
            top:45%;
            border:none;
            
        }
        #btnLeft{
            right: 0px;
        }
        /* .icon{
            /* color:white; */
            /* 1rem=16px
            2.5rem=40px */
            /* font-size:2.5rem;
        } */ 

    </style>
</head>

<body>
    <div class="main">
        <div class="center">
            <div class="images"onmouseover="playPause('pause')" onmouseout="playPause('play')">
                <img src="dom.jpeg" width="700px"height="400px"alt="">
                <img src="fleximage2.jpg" width="700px"height="500px" alt="">
                <img src="fleximage3.jpg" width="700px"height="500px" alt="">
                <img src="fleximage4.jpg" width="700px"height="500px" alt="">
                <img src="image1.jpg" width="700px"height="500px" alt="">
                <img src="image2.jpg" width="700px"height="500px" alt="">
                <img src="payal.jpg"width="700px"height="500px" alt="">
                <img src="pexels-eugeniofr-30005297.jpg" width="700px"height="500px" alt="">
                <img src="pexels-mayaramombellifotografias-34382333.jpg" width="700px"height="500px" alt="">
                <img src="pexels-fakhribagirov-31618288.jpg" width="700px"height="500px" alt="">



            </div>
           <button class="btn" id="btnLeft" onclick="prev()">
    <span class="material-symbols-outlined">arrow_forward_ios</span>
</button>

<button class="btn" id="btnRight" onclick="next()">
    <span class="material-symbols-outlined">arrow_back_ios</span>
</button>

        </div>
    </div>
   
<script>
    var images = document.querySelectorAll(".images img");
    var index = 0;

    function next() {
        images[index].style.display = "none";

        if (index === images.length - 1) {
            index = 0;  // last image → first
        } else {
            index++;    // move to next image
        }

        images[index].style.display = "block";
    }
    function prev(){
        images[index].style.display="none"
        if(index===0)
        index=images.length-1
    else
    index--
images[index].style.display="block"
    }
   let time= setInterval(next,1000)
   function playPause(option){
    if(option==="pause")
    clearInterval(time)
else
time=setInterval(next,1000)
   }
</script>

    
    
</body>
</html>
